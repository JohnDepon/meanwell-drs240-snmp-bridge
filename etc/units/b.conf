# The second DRS-240 on the same bus. See a.conf for what every key means.

[modbus]
# 0x82 = A1 open, A0 shorted to GND. Strap this one; leaving both supplies at
# the factory 0x83 is the failure this file exists to avoid.
slave_id = 0x82

[snmp]
port = 1162

[ups]
name = Rack B DC UPS
attached_devices = Rack B switch and camera NVR
battery_capacity_ah = 50

[notify]
subject = [{unit}] {severity}: {title}
