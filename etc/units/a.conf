# One DRS-240 on the shared RS485 bus.
#
# Installed to /opt/drs240/etc/units/a.conf. This file is layered on top of
# drs240.conf, so only what differs between supplies belongs here -- the
# serial port, [smtp] and [log] stay shared.
#
# THE FILE NAME IS THE UNIT NAME. "a" shows up in the daemon's log lines, in
# the state file path, in {unit} in notification subjects, and as the systemd
# instance: drs240-snmpd-ups@a.service. Rename the file to rename the unit.

[modbus]
# Each PSU needs its own address, strapped on CN1 A0/A1 -- see docs/WIRING.md.
# The ID is 0x8X with X = 0-3, so a bus holds at most FOUR DRS-240s and 0x84
# does not exist. Two supplies left on the same address collide on every poll
# and give you CRC errors, not a "duplicate address" complaint.
#
# 0x83 is both lines open, which is how the unit ships: this is the supply you
# leave unstrapped.
slave_id = 0x83

[snmp]
# The port this unit's own snmpd instance listens on. One per unit, all
# different -- LibreNMS adds each as a separate UPS device.
port = 1161

[ups]
name = Rack A DC UPS
attached_devices = Rack A switch and router
# The PSU cannot know what is bolted to its battery terminals, and without
# this there is no runtime estimate at all.
battery_capacity_ah = 50

[notify]
# {unit} is this file's name. Worth setting: both supplies are the same model
# with the same firmware, so the default subject makes their mail identical.
subject = [{unit}] {severity}: {title}

[poll]
# Defaults to /run/drs240/state-a.json -- derived from the unit name, so two
# units never share one file. Only set this to move it somewhere else.
# state_file = /run/drs240/state-a.json
