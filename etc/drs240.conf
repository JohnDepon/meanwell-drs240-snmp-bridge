# Shared configuration for the DRS-240 Modbus-to-SNMP bridge.
# Installed to /opt/drs240/etc/drs240.conf.
#
# A deployment is one or more UNITS -- one DRS-240 each, all on the same RS485
# bus. This file holds what they share: the serial port, poll timing, the SMTP
# account, the log level. Anything that differs per supply goes in its own
# file under /opt/drs240/etc/units/, which is layered on top of this one:
#
#   /opt/drs240/etc/drs240.conf        <- you are here
#   /opt/drs240/etc/units/a.conf       <- slave_id, snmp port, [ups] ratings
#   /opt/drs240/etc/units/b.conf
#
# The unit file wins key by key, so it only needs the handful of settings that
# actually differ. `drs240 units` lists what is configured.
#
# With no units/ directory there is exactly one unit called "default",
# configured entirely from this file -- so a single-PSU install can ignore all
# of the above and just edit here.

[modbus]
# Serial port of the RS485 adapter. Prefer the stable by-id path so a reboot
# or a second USB serial device cannot renumber it:
#   ls -l /dev/serial/by-id/
port = /dev/ttyUSB0

# Fixed by the DRS-240: 115200 8N1, no flow control.
baudrate = 115200

# Slave ID is 0x8X where X is strapped on CN1 pins 5 (A0) and 6 (A1):
# open = 1, shorted to GND = 0. With CN1 unconnected -- as the unit ships --
# both read 1, so the address is 0x83. Run `drs240 probe` to confirm.
#
# PER UNIT. This value is only used by the single "default" unit; with a
# units/ directory every supply sets its own here-overriding slave_id, because
# two of them on one address collide on every poll. X = 0-3 is the whole
# range, so a bus holds at most four DRS-240s.
slave_id = 0x83

# Response timeout in seconds. The PSU answers within 12.5 ms; the rest is
# headroom for USB latency.
timeout = 0.5

# Minimum gap between requests. The manual specifies 50 ms; do not go lower.
min_interval = 0.05

# Retries per request before a poll is counted as failed.
retries = 2

[poll]
# Seconds between polls. LibreNMS polls every 5 minutes by default, so
# anything under that keeps its graphs fresh; 10 s also makes an AC failure
# visible almost immediately to an alert rule.
interval = 10

# Read the configured set points (VOUT_SET, charge curve, cut-off) only every
# Nth poll -- they change rarely and each one costs a bus transaction.
settings_every = 30

# Where the daemon publishes its readings. Under /run so it lives in tmpfs and
# never wears the SD card. The systemd unit creates /run/drs240 for you.
#
# PER UNIT, and derived automatically: a unit called "b" publishes to
# /run/drs240/state-b.json unless its own file overrides this. Only the single
# "default" unit uses the path below, so two supplies can never end up writing
# the same file.
state_file = /run/drs240/state.json

# If the state file is older than this many seconds, SNMP reports the bridge
# as down rather than serving stale numbers.
stale_after = 60

# How often to re-read just the three status registers, to spot an AC failure
# between full polls. Blank = a fifth of `interval`, capped at 2 s. This is
# what makes notifications near-realtime; three registers is negligible bus
# traffic. Do not set it below 0.5.
event_interval =

[ups]
# Settings for the RFC 1628 UPS-MIB presentation served by this unit's own
# snmpd instance. Leave a value blank and it is worked out from the model the
# PSU reports over Modbus.
#
# NEARLY ALL PER UNIT. Two supplies rarely have the same battery bank or feed
# the same load, so with a units/ directory `name`, `attached_devices` and
# `battery_capacity_ah` belong in each unit's own file. The values here are
# the fallback for anything a unit file does not set.

# upsIdentName, shown as the device name by some NMS front ends.
name = DRS-240 DC UPS

# upsIdentAttachedDevices -- free text, e.g. "Alarm panel, door controllers".
attached_devices =

# Blank = take the datasheet ratings for the detected model. For a
# DRS-240-24 that is 24 V, 10 A, 240 W.
nominal_output_voltage =
rated_output_current =
rated_output_power =
nominal_battery_voltage =

# THE ONE YOU HAVE TO SET. Battery bank capacity in amp-hours; the PSU has no
# idea what is bolted to its terminals. Leave it at 0 and the bridge publishes
# no upsEstimatedMinutesRemaining at all, rather than inventing one.
# The DRS-240-24 datasheet recommends 10-100 Ah.
battery_capacity_ah = 0

# Fraction of the nameplate capacity actually usable at a real discharge
# rate. 0.8 is a reasonable lead-acid starting point; lower it if the runtime
# estimate turns out optimistic against a real discharge.
battery_derate = 0.8

# upsConfigLowBattTime: minutes of runtime the UPS considers "low battery".
low_battery_minutes = 5

# upsConfigInputVoltage, the nominal mains voltage. Cosmetic.
nominal_input_voltage = 230

###############################################################################
# Email notification
###############################################################################
# Events are detected on the fast tick above, so a mains failure is mailed
# within a couple of seconds rather than at the next monitoring cycle.
#
# Check your setup without waiting for a real outage:
#     drs240 notify                 show what is configured
#     drs240 notify --preview       print the message it would send
#     drs240 notify --test          actually send one
#     drs240 notify --list-events   every event name

[notify]
enabled = no

# sendmail  hand the message to the local MTA -- no credentials here, and it
#           queues and retries on its own. Needs postfix, msmtp-mta,
#           nullmailer or similar installed.
# smtp      talk to a remote SMTP server directly, configured in [smtp] below.
# none      turn mail off while leaving the exec hook working.
method = sendmail

# Envelope. `from` defaults to user@fqdn; many providers insist it matches the
# authenticated account. `to` takes a comma-separated list.
from =
to =

# Subject template. Available: {event} {title} {severity} {hostname} {model}
# {serial} {unit}
#
# With several supplies, put {unit} in here or in each unit file: they are the
# same model with the same firmware, so without it their mail is identical
# apart from the serial number. The unit files shipped as examples set
#     subject = [{unit}] {severity}: {title}
subject = [{model}] {severity}: {title}

# Which events to mail. "all", or a comma-separated list, e.g.
#     events = onbattery, offbattery, battlow, battdepleted, commfail
events = all

# Seconds before the same event may be mailed again. Stops a flapping mains
# supply filling your inbox.
min_interval = 60

# While running on battery, send a reminder this often. 0 turns it off.
on_battery_reminder = 900

# A mains failure often takes the network with it, so a failed send is retried
# with a doubling backoff: 30s, 60s, 120s, 240s, 480s covers about 15 minutes.
retries = 5
retry_backoff = 30

sendmail_path = /usr/sbin/sendmail

# Optional command run on every event, apcupsd-style, regardless of the mail
# filter above. Argument 1 is the event name; details arrive in the
# environment as DRS240_UNIT, DRS240_EVENT, DRS240_SEVERITY, DRS240_VBAT,
# DRS240_SECONDS_ON_BATTERY and friends. Useful for triggering a graceful
# shutdown once the battery gets low -- see examples/drs240-event.sh, which
# uses DRS240_UNIT so only the supply feeding this machine can shut it down.
exec =

[smtp]
# Only read when method = smtp. Shared by every unit; there is no reason for
# two supplies on one Pi to use different mail servers, and a unit file can
# still override it if yours do.
host =
# Blank picks the default for the security setting: 465 ssl, 587 starttls,
# 25 none.
port =
# none | starttls | ssl
security = starttls
username =

# Leave `password` empty and point `password_file` at a 0600 file instead:
# this config is world-readable so the SNMP agent can read the rest of it.
# The daemon warns at start-up if a password is sitting here in the open.
password =
password_file =

timeout = 20
# Override the HELO/EHLO name if your provider is fussy about it.
helo =

[log]
# DEBUG logs every Modbus retry, which is what you want while fault-finding.
level = INFO
